[workspace]
resolver = "2"
members = ["crates/renderer", "crates/wasm"]

[workspace.package]
edition = "2021"
rust-version = "1.87"
repository = "https://github.com/casoon/kestrel-loom"
# Lizenz bewusst offen — siehe plan/00-konzept.md §6 (M0).
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
