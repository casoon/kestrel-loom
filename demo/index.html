<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kestrel-loom — Demo</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #0b0f14;
        color: #c9d3df;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        display: flex; align-items: center; gap: 16px;
        padding: 10px 16px; border-bottom: 1px solid #1b2530;
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em; }
      .spacer { flex: 1; }
      button, select {
        background: #131a22; color: #c9d3df; border: 1px solid #22303d;
        border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
      }
      button:hover, select:hover { border-color: #35485a; }
      #wrap { padding: 16px; }
      canvas { display: block; width: 100%; height: 70vh; border: 1px solid #1b2530; border-radius: 6px; }
      #status { padding: 8px 16px; color: #6f8496; border-top: 1px solid #1b2530; }
    </style>
  </head>
  <body>
    <header>
      <h1>kestrel-loom</h1>
      <select id="style">
        <option value="candlestick">Candlestick</option>
        <option value="ohlc">OHLC</option>
        <option value="hollow">Hollow</option>
        <option value="line">Line</option>
        <option value="area">Area</option>
        <option value="heikinashi">Heikin Ashi</option>
        <option value="renko:0.5">Renko</option>
      </select>
      <select id="indicator"><option value="">— Indikator —</option></select>
      <label><input type="checkbox" id="artifacts" /> Artefakte</label>
      <button id="fit">Fit</button>
      <button id="theme">Theme</button>
      <div class="spacer"></div>
      <span id="count"></span>
    </header>
    <div id="wrap"><canvas id="chart"></canvas></div>
    <div id="status">lädt…</div>

    <script type="module">
      // Die Demo nutzt dieselbe Hülle, die auch Kestrel einbinden würde —
      // sie ist damit zugleich der Beleg, dass die Hülle trägt.
      import { createChart } from '../js/kestrel-loom.js';

      const status = document.getElementById('status');
      const canvas = document.getElementById('chart');

      // Deterministische Kerzen, damit die Demo bei jedem Laden dasselbe zeigt.
      function candles(n, seed = 42) {
        let s = seed >>> 0;
        const rnd = () => {
          s ^= s << 13; s >>>= 0;
          s ^= s >> 17;
          s ^= s << 5; s >>>= 0;
          return s / 4294967296;
        };
        const out = [];
        let price = 100;
        let time = 1600000000; // Unix-Sekunden
        for (let i = 0; i < n; i++) {
          const o = price;
          const c = Math.max(1, o + (rnd() - 0.48) * 0.9);
          out.push({
            time,
            o,
            h: Math.max(o, c) + rnd() * 0.5,
            l: Math.min(o, c) - rnd() * 0.5,
            c,
            v: 100 + rnd() * 900,
          });
          price = c;
          time += 300; // M5
        }
        return out;
      }

      try {
        const chart = await createChart(canvas, { timeframe: '5m', dark: true });

        const data = candles(300);
        chart.data.set(data);
        chart.view.fit();

        document.getElementById('count').textContent = `${data.length} Kerzen`;
        status.textContent = 'ok — Zoom mit dem Mausrad, Pan mit gedrückter Maustaste.';

        const indicatorSelect = document.getElementById('indicator');
        const all = chart.indicators.available();
        for (const name of all) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          indicatorSelect.appendChild(opt);
        }
        indicatorSelect.addEventListener('change', (e) => {
          const name = e.target.value;
          if (!name) return;
          try {
            chart.indicators.add(name);
            status.textContent = `Indikator ${name} — ${all.length} im Katalog`;
          } catch (err) {
            status.textContent = `indicators.add("${name}") abgelehnt: ${err}`;
          }
        });

        document.getElementById('style').addEventListener('change', (e) => {
          try {
            chart.style.set(e.target.value);
            status.textContent = 'Darstellung: ' + e.target.value;
          } catch (err) {
            status.textContent = `style.set("${e.target.value}") abgelehnt: ${err}`;
          }
        });

        document.getElementById('artifacts').addEventListener('change', (e) => {
          chart.indicators.artifacts(e.target.checked);
          status.textContent = e.target.checked
            ? 'Artefakte an — sichtbar bei Indikatoren, die welche melden (z. B. extended_volume_profile)'
            : 'Artefakte aus';
        });

        document.getElementById('fit').addEventListener('click', () => chart.view.fit());

        let dark = true;
        document.getElementById('theme').addEventListener('click', () => {
          dark = !dark;
          chart.view.theme(dark);
        });

        // Für die Konsole
        window.chart = chart;
      } catch (err) {
        status.textContent = 'Fehler: ' + err;
        console.error(err);
      }
    </script>
  </body>
</html>
